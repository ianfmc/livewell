[project]
name = "livewell-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "yfinance>=1.3.0",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "boto3>=1.42.95",
    "pandas-ta",
    "scikit-learn>=1.8.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "anthropic>=0.98.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "moto[s3,dynamodb]>=5.1.22",
    "nbformat>=5.10.4",
    "nbclient>=0.10.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
